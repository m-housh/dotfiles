name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dev-env:
    name: dev-env
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n dev-env tests/dev-env-test

      - name: Run ShellCheck
        run: shellcheck dev-env tests/dev-env-test

      - name: Run integration tests
        run: tests/dev-env-test
