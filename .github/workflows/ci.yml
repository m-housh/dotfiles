name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n dev-env devcontainer-env tests/run-all tests/*-test

      - name: Run ShellCheck
        run: shellcheck dev-env devcontainer-env tests/run-all tests/*-test

      - name: Run integration tests
        run: tests/run-all
