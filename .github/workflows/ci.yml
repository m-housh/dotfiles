name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Supported entry points, their lifecycle/webapp helpers, and test scripts.
  # Deferred legacy bootstrap and repos scripts are intentionally excluded.
  BASH_FILES: >-
    dev-env
    devcontainer-env
    gen
    run
    webapp
    runs/before/*
    runs/after/*
    runs/utils/run-handler
    env/.local/scripts/wt
    env/.local/scripts/herdr-flow
    env/.local/scripts/hypr/logging
    env/.local/scripts/hypr/webapp
    env/.local/scripts/hypr/uninstall-desktop-app
    env/.local/scripts/hypr/utils/webapp/*
    tests/run-all
    tests/*-test

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n $BASH_FILES

      - name: Run ShellCheck
        run: shellcheck $BASH_FILES

      - name: Run integration tests
        run: tests/run-all
